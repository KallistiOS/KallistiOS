# KallistiOS Toolchain Builder (kos-chain)

#########################
### TOOLCHAIN PROFILE ###
#########################

# Experimental original Xbox toolchain. This builds only the GNU cross tools;
# KallistiOS still needs an Xbox CRT/startup, linker script, and XBE converter
# before it can produce bootable console binaries.
platform=xbox

# Choose a toolchain profile from the following available options:
# Release toolchains:
# - stable:       Stable: based on GCC 16.1.0, Binutils 2.46.1, and Newlib 4.6.0.
# Development toolchains:
# - 17.0.0-dev:   Bleeding edge GCC 17 series from git.
toolchain_profile=stable

########################
### DOWNLOAD OPTIONS ###
########################

download_protocol=https

#####################
### BUILD OPTIONS ###
#####################

# Persistent install prefix for the original Xbox cross toolchain.
toolchain_path=/opt/toolchains/xbox/i686-pc-xbox

makejobs=
verbose=1
erase=1

########################
### LANGUAGE OPTIONS ###
########################

enable_cpp=1
enable_objc=0
enable_objcpp=0

###################
### GCC OPTIONS ###
###################

# There is no KOS Xbox threading backend yet.
thread_model=kos

######################
### NEWLIB OPTIONS ###
######################

# Do not apply Dreamcast/KOS fixups until an Xbox arch port exists.
newlib_c99_formats=1
